[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosperousplus"
version = "0.1.0"
requires-python = ">=3.7"
dependencies = [
    "pandas",
    "biopython",
    "matplotlib",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["lib", "scripts"]

[project.scripts]
run-pipeline  = "scripts.run_pipeline:main"
run-cohort    = "scripts.run_cohort:main"
annotate-ptm  = "scripts.annotate_ptm:main"
plot-results  = "scripts.plot_results:main"
plot-cohort   = "scripts.plot_cohort:main"
